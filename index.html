<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons (generated by scripts/generate-icons.cjs) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XspensesAI" />
    <meta name="application-name" content="XspensesAI" />
    <meta name="msapplication-TileColor" content="#0b1220" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <title>XspensesAI — The Finance App That Talks Back</title>
    <meta name="description" content="6 AI agents manage your money while you live your life. Upload a statement and watch them work. Bank-level security, PII protection, encrypted data." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xspensesai.com/" />
    <meta property="og:title" content="XspensesAI — The Finance App That Talks Back" />
    <meta property="og:description" content="6 AI agents manage your money while you live your life. Upload a statement and watch them work." />
    <meta property="og:image" content="https://xspensesai.com/icon-512x512.png" />
    <meta property="og:site_name" content="XspensesAI" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="XspensesAI — The Finance App That Talks Back" />
    <meta property="twitter:description" content="6 AI agents manage your money while you live your life." />
    <meta property="twitter:image" content="https://xspensesai.com/icon-512x512.png" />

    <!-- Base URL for SPA routing -->
    <base href="/" />
  </head>
  <body>
    <div id="root"></div>
    <div id="portal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>

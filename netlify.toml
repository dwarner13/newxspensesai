[build]
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_shared/**", "netlify/functions/_lib/**"]
  external_node_modules = ["pdf-parse", "@napi-rs/canvas", "@napi-rs/canvas-win32-x64-msvc"]

[dev]
  framework = "vite"
  command = "npm run dev"
  targetPort = 5174
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions.esbuild]
  sourcemap = false
  format = "cjs"
  external = ["xhr-sync-worker.js", "@napi-rs/canvas", "@napi-rs/canvas-win32-x64-msvc"]


[build]
  command = "pnpm install --no-frozen-lockfile && pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_shared/**", "netlify/functions/lib/**"]
  external_node_modules = ["undici", "jsdom", "@mozilla/readability", "pdf-lib", "pdfjs-dist", "@napi-rs/canvas", "sharp"]
[dev]
  framework = "vite"
  command = "vite --port 5174 --host --strictPort"
  targetPort = 5174
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions.esbuild]
  sourcemap = false
  format = "cjs"
  external = ["xhr-sync-worker.js", "@napi-rs/canvas", "@napi-rs/canvas-win32-x64-msvc"]

[functions."apply-category-rules"]
  timeout = 30

[functions."prime-router"]
  timeout = 60

[functions."smart-import-sync"]
  timeout = 180

[functions."chat"]
  timeout = 60

[functions."process-spreadsheet"]
  timeout = 60

[functions."smart-import-ocr-background"]
  timeout = 120
[functions."normalize-transactions"]
  timeout = 120

[functions."auto-commit-import"]
  timeout = 120

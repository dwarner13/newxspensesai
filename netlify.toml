[build]
  command = "pnpm install --no-frozen-lockfile && pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Mark dependencies as external to avoid bundling them into each function
  # External packages are resolved from node_modules at runtime — all listed packages provide CJS exports
  # @supabase/supabase-js: ~4MB total, has dist/main/index.js (CJS) — safe to externalize
  # zod: ~4.8MB source, has index.cjs — safe to externalize
  # zod-to-json-schema: 435KB, has dist/cjs/index.js — safe to externalize
  # jsdom: used by safe_web_research tool but doesn't bundle well with esbuild
  included_files = ["netlify/functions/_shared/**", "netlify/functions/_lib/**"]
  external_node_modules = ["openai", "undici", "jsdom", "@mozilla/readability", "pdf-parse", "pdf-lib", "@napi-rs/canvas", "@napi-rs/canvas-win32-x64-msvc", "@supabase/supabase-js", "zod", "zod-to-json-schema"]
  # NOTE: Environment variables are configured in Netlify Dashboard
  # VITE_ prefixed vars are automatically excluded from functions (frontend-only)
  # To avoid AWS Lambda 4KB env var limit, ensure only necessary vars are set in dashboard

[dev]
  framework = "vite"
  command = "vite --port 5174 --host --strictPort"
  targetPort = 5174
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions.esbuild]
  sourcemap = false
  format = "cjs"
  external = ["xhr-sync-worker.js", "@napi-rs/canvas", "@napi-rs/canvas-win32-x64-msvc"]

[functions."prime-router"]
  timeout = 60

[functions."smart-import-sync"]
  timeout = 60

[functions."chat"]
  timeout = 60
